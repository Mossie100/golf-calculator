<script>
(function(){
  function hideBaseline(){
    document.querySelectorAll('div').forEach(el=>{
      const t=(el.textContent||'');
      if(t.includes('V6.7 MASTER')||(t.includes('Summer baseline')&&t.includes('driver')&&t.length<300&&!t.includes('Driver 10°'))){
        if(el.textContent.includes('Driver 10°'))return;
        if(el.className&&el.className.includes('rounded-xl')&&el.offsetHeight<150&&!el.className.includes('border-[#1e40af]')){
          el.style.display='none';
        }
      }
    });
  }

  function addLongPress(){
    if(document.getElementById('__lpBtn')) return true;
    const resetBtn = Array.from(document.querySelectorAll('button')).find(b=>b.textContent.trim()==='Restore default settings');
    if(!resetBtn) return false;
    // refresh weather removed - no check needed
    if(document.getElementById('__lpWrapper')) return true;
    
    const wrapper=document.createElement('div');
    wrapper.id='__lpWrapper';
    wrapper.style.cssText='margin-top:32px;width:100%;display:flex;flex-direction:column;align-items:center;';
    wrapper.innerHTML=`
      <button id="__lpBtn" style="height:52px;min-width:220px;padding-left:32px;padding-right:32px;border-radius:12px;background:#fecaca;border:2px solid #dc2626;color:#991b1b;font-weight:700;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,0.15);">
        <div id="__lpProgress" style="position:absolute;left:0;top:0;height:100%;width:0%;background:#fca5a5;"></div>
        <span style="position:relative;z-index:10;font-size:14px;font-weight:700;line-height:1.1;">Full app reset</span>
        <span style="position:relative;z-index:10;font-size:11px;font-weight:400;line-height:1.1;margin-top:2px;">Long press for 5 sec</span>
      </button>
      <div style="text-align:center;margin-top:6px;"><p style="font-size:12px;color:#dc2626;font-weight:600;text-align:center;">This will erase and clear all input data, including stock distances, locations and weather</p></div><div id="__lpSuccess" style="display:none;text-align:center;font-size:12px;color:#15803d;margin-top:6px;">All defaults cleared successfully</div><p id="__lpStatus" style="font-size:11px;color:#991b1b;text-align:center;margin-top:6px;display:none;"></p>
    `;
    resetBtn.parentElement.parentElement.insertBefore(wrapper, resetBtn.parentElement.nextSibling);
    
    const btn=document.getElementById('__lpBtn');
    const status=document.getElementById('__lpStatus');
    let timer, progInt, start;
    
    function doResetNoReload(){
      status.style.display='block';
      status.textContent='Resetting…';
      try{window.dispatchEvent(new CustomEvent('golf-reset-now'));setTimeout(()=>{let succ=document.getElementById('__lpSuccess'); if(succ){ succ.style.display='block'; setTimeout(()=>{succ.style.display='none';},1000); } status.textContent='';;status.style.color='#15803d'},150)}catch(e){status.textContent='Error: '+e.message;status.style.color='#991b1b';console.error(e)}
    }
    
    function startPress(e){
      if(e) e.preventDefault();
      btn.style.backgroundColor='#dc2626'; btn.style.color='white';
      start=Date.now();
      const prog=document.getElementById('__lpProgress');
      progInt=setInterval(()=>{ const pct=Math.min(100, ((Date.now()-start)/5000)*100); if(prog) prog.style.width=pct+'%'; },50);
      timer=setTimeout(()=>{ clearInterval(progInt); doResetNoReload(); },5000);
    }
    function cancelPress(){
      clearTimeout(timer); clearInterval(progInt);
      btn.style.backgroundColor='#fecaca'; btn.style.color='#991b1b';
      const prog=document.getElementById('__lpProgress'); if(prog) prog.style.width='0%';
    }
    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);
    btn.addEventListener('touchstart', startPress, {passive:false});
    btn.addEventListener('touchend', cancelPress);
    return true;
  }
  
  setInterval(()=>{ hideBaseline(); addLongPress(); },500);
})();
</script>

<script>
(function(){
  function setupZeroPlaceholder(){
    document.querySelectorAll('input[type="number"]').forEach(inp=>{
      // If value is 0, show placeholder 0 but clear on focus
      if(inp.value==="0"){
        // Keep value as 0 but add listener
        if(!inp.__zeroHandler){
          inp.__zeroHandler=true;
          inp.addEventListener('focus', function(){
            if(this.value==="0"){
              this.value="";
            }
          });
          inp.addEventListener('blur', function(){
            if(this.value===""){
              this.value="0";
              // Trigger change event to update React state to 0
              this.dispatchEvent(new Event('input', {bubbles:true}));
              this.dispatchEvent(new Event('change', {bubbles:true}));
            }
          });
        }
      }
    });
  }
  setInterval(setupZeroPlaceholder, 500);
})();

<script>
(function(){
  function finalFix(){
    try{
      const h3s = Array.from(document.querySelectorAll('h3')).filter(h=>h.textContent && h.textContent.includes('Reset & Defaults'));
      h3s.forEach(h3=>{
        const container = h3.closest('div.bg-white');
        if(!container || container.dataset.finalFixed==='1') return;

        const blueBtn = Array.from(container.querySelectorAll('button')).find(b=>b.textContent.trim()==='Save as default settings');
        const greenBtn = Array.from(container.querySelectorAll('button')).find(b=>b.textContent.trim()==='Restore default settings');
        let redBtn = document.getElementById('__lpBtn');
        if(!redBtn) redBtn = Array.from(document.querySelectorAll('button')).find(b=>b.textContent.includes('Full app reset'));
        if(!blueBtn || !greenBtn || !redBtn) return;

        // Style red button same size as blue/green
        redBtn.style.backgroundColor = '#fecaca';
        redBtn.style.color = '#991b1b';
        redBtn.style.border = '2px solid #ef4444';
        redBtn.style.boxShadow = '0 2px 6px rgba(0,0,0,0.15)';
        redBtn.style.fontWeight = '700';
        redBtn.style.minWidth = '220px';
        redBtn.style.height = '40px';
        redBtn.style.padding = '0 32px';
        redBtn.style.borderRadius = '12px';
        redBtn.style.fontSize = '14px';
        redBtn.style.display = 'flex';
        redBtn.style.alignItems = 'center';
        redBtn.style.justifyContent = 'center';
        redBtn.innerHTML = 'Full app reset';

        const blueText = Array.from(container.querySelectorAll('p')).find(p=>p.textContent.includes('Save all input data as defaults'));
        const greenText1 = Array.from(container.querySelectorAll('p')).find(p=>p.textContent.includes('Restore original stock data and clear overrides'));
        const greenText2 = Array.from(container.querySelectorAll('p')).find(p=>p.textContent.includes('Persists via localStorage'));
        const eraseText = Array.from(document.querySelectorAll('p')).find(p=>p.textContent.includes('This will erase and clear all input data'));

        const ordered = document.createElement('div');
        ordered.style.display='flex';
        ordered.style.flexDirection='column';
        ordered.style.alignItems='center';
        ordered.style.width='100%';

        const sec1 = document.createElement('div');
        sec1.style.display='flex';
        sec1.style.flexDirection='column';
        sec1.style.alignItems='center';
        sec1.style.width='100%';
        sec1.style.marginTop='16px';
        const btnDiv1 = blueBtn.closest('div.flex, div.mt-3') || blueBtn.parentElement;
        sec1.appendChild(btnDiv1);
        if(blueText){
          blueText.style.display='block';
          blueText.style.marginTop='12px';
          blueText.style.textAlign='center';
          blueText.style.width='100%';
          blueText.style.padding='0 8px';
          blueText.style.fontSize='11px';
          sec1.appendChild(blueText);
        }

        const sec2 = document.createElement('div');
        sec2.style.display='flex';
        sec2.style.flexDirection='column';
        sec2.style.alignItems='center';
        sec2.style.width='100%';
        sec2.style.marginTop='24px';
        sec2.style.paddingTop='16px';
        sec2.style.borderTop='1px solid #f3f4f6';
        const btnDiv2 = greenBtn.closest('div.flex, div.mt-3') || greenBtn.parentElement;
        sec2.appendChild(btnDiv2);
        if(greenText1){
          greenText1.style.display='block';
          greenText1.style.marginTop='12px';
          greenText1.style.textAlign='center';
          greenText1.style.width='100%';
          greenText1.style.fontSize='12px';
          sec2.appendChild(greenText1);
        }
        if(greenText2){
          greenText2.style.display='block';
          greenText2.style.marginTop='4px';
          greenText2.style.textAlign='center';
          greenText2.style.width='100%';
          greenText2.style.fontSize='11px';
          sec2.appendChild(greenText2);
        }

        const sec3 = document.createElement('div');
        sec3.style.display='flex';
        sec3.style.flexDirection='column';
        sec3.style.alignItems='center';
        sec3.style.width='100%';
        sec3.style.marginTop='24px';
        sec3.style.paddingTop='16px';
        sec3.style.borderTop='1px solid #f3f4f6';
        const redBtnDiv = redBtn.closest('div.flex, div.mt-3') || redBtn.parentElement;
        if(redBtnDiv){
          redBtnDiv.style.display='flex';
          redBtnDiv.style.justifyContent='center';
          redBtnDiv.style.width='100%';
          sec3.appendChild(redBtnDiv);
        } else {
          sec3.appendChild(redBtn);
        }

        const lpText = document.createElement('p');
        lpText.textContent = 'Long press for 5 sec';
        lpText.style.fontSize='11px';
        lpText.style.marginTop='6px';
        lpText.style.textAlign='center';
        lpText.style.display='block';
        sec3.appendChild(lpText);

        if(eraseText){
          eraseText.style.display='block';
          eraseText.style.fontSize='11px';
          eraseText.style.color='#dc2626';
          eraseText.style.fontWeight='600';
          eraseText.style.textAlign='center';
          eraseText.style.marginTop='6px';
          eraseText.style.width='100%';
          sec3.appendChild(eraseText);
        }

        const keepH3 = container.querySelector('h3');
        Array.from(container.children).forEach(ch=>{ if(ch!==keepH3) ch.remove(); });
        ordered.appendChild(sec1);
        ordered.appendChild(sec2);
        ordered.appendChild(sec3);
        container.appendChild(ordered);
        container.dataset.finalFixed='1';

        // Clean duplicates outside
        const allLong = Array.from(document.querySelectorAll('p, span')).filter(el=>el.textContent.trim()==='Long press for 5 sec');
        allLong.forEach((el,idx)=>{
          if(!sec3.contains(el)) el.remove();
        });
        const allErase = Array.from(document.querySelectorAll('p')).filter(p=>p.textContent.includes('This will erase and clear all input data'));
        allErase.forEach((el,idx)=>{
          if(!sec3.contains(el)) el.remove();
        });
        const allRed = Array.from(document.querySelectorAll('button')).filter(b=>b.textContent.includes('Full app reset'));
        allRed.forEach((b,idx)=>{
          if(b!==redBtn) {
            const w = b.closest('#__lpWrap') || b.parentElement;
            if(w && !sec3.contains(w)) w.remove();
          }
        });
        // Remove extra __lpWrap
        document.querySelectorAll('#__lpWrap').forEach((w,idx)=>{
          if(!sec3.contains(w)) {
            // keep first that contains redBtn, remove others
            if(!w.contains(redBtn)) w.remove();
          }
        });
      });
    }catch(e){ console.log('finalFix error', e); }
  }
  let attempts=0;
  const iv=setInterval(()=>{ finalFix(); attempts++; if(attempts>60) clearInterval(iv); },300);
  window.addEventListener('load', finalFix);
  document.addEventListener('DOMContentLoaded', finalFix);
})();
</script>
